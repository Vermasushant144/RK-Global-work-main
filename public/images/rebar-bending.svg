<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B89BF" />
      <stop offset="50%" stop-color="#90C5EC" />
      <stop offset="100%" stop-color="#DCEEFC" />
    </linearGradient>

    <linearGradient id="groundGrad" x1="0" y1="580" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4C4" />
      <stop offset="40%" stop-color="#7B8CA0" />
      <stop offset="100%" stop-color="#526274" />
    </linearGradient>

    <linearGradient id="machineBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0077D6" />
      <stop offset="50%" stop-color="#005BAB" />
      <stop offset="100%" stop-color="#003D75" />
    </linearGradient>

    <linearGradient id="steelMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  {/* Sky Background */}
  <rect width="1600" height="580" fill="url(#skyGrad)" />

  {/* Clouds */}
  <path d="M 200 150 Q 240 100 300 130 Q 360 90 420 130 Q 480 120 520 160 Z" fill="#FFFFFF" opacity="0.6" />
  <path d="M 800 180 Q 850 120 920 150 Q 980 110 1050 160 Z" fill="#FFFFFF" opacity="0.5" />
  <path d="M 1200 120 Q 1260 70 1340 100 Q 1400 80 1460 130 Z" fill="#FFFFFF" opacity="0.7" />

  {/* Distant Skyscrapers */}
  <rect x="750" y="200" width="140" height="380" fill="#64748B" opacity="0.4" />
  <rect x="910" y="140" width="160" height="440" fill="#475569" opacity="0.45" />
  <rect x="1090" y="240" width="120" height="340" fill="#475569" opacity="0.35" />
  <rect x="1230" y="180" width="180" height="400" fill="#334155" opacity="0.5" />

  {/* Construction Crane */}
  <line x1="1450" y1="120" x2="1450" y2="580" stroke="#0B1F33" stroke-width="4" opacity="0.5" />
  <line x1="1380" y1="180" x2="1520" y2="180" stroke="#0B1F33" stroke-width="3" opacity="0.5" />

  {/* Ground Concrete Plaza */}
  <rect y="580" width="1600" height="320" fill="url(#groundGrad)" />
  {/* Perspective lines */}
  <line x1="0" y1="720" x2="1600" y2="720" stroke="#CBD5E1" stroke-width="1" opacity="0.3" />
  <line x1="0" y1="820" x2="1600" y2="820" stroke="#CBD5E1" stroke-width="1" opacity="0.3" />

  {/* Machinery 1: Main Blue Rebar Bending Machine */}
  <g transform="translate(720, 360)">
    {/* Shadow */}
    <ellipse cx="200" cy="380" rx="220" ry="30" fill="#1E293B" opacity="0.4" />

    {/* Main Cabinet */}
    <rect x="30" y="80" width="340" height="280" rx="16" fill="url(#machineBlue)" stroke="#0B1F33" stroke-width="4" />
    <rect x="50" y="100" width="300" height="240" rx="12" fill="#FFFFFF" stroke="#005BAB" stroke-width="3" />
    <rect x="70" y="120" width="260" height="200" fill="url(#machineBlue)" rx="8" />

    {/* Top Work Table Plate */}
    <rect x="10" y="40" width="380" height="45" rx="8" fill="url(#steelMetal)" stroke="#0B1F33" stroke-width="3" />
    <ellipse cx="200" cy="62" rx="120" ry="16" fill="#1E293B" />
    <circle cx="200" cy="62" r="70" fill="url(#steelMetal)" stroke="#0B1F33" stroke-width="3" />
    <circle cx="200" cy="62" r="30" fill="#0B1F33" />
    <circle cx="170" cy="62" r="10" fill="#F47B20" />
    <circle cx="230" cy="62" r="10" fill="#F47B20" />

    {/* Red Buttons & Emergency Stop */}
    <circle cx="100" cy="150" r="12" fill="#EF4444" stroke="#7F1D1D" stroke-width="2" />
    <circle cx="130" cy="150" r="8" fill="#10B981" />
    <circle cx="150" cy="150" r="8" fill="#F59E0B" />
    <circle cx="170" cy="150" r="8" fill="#3B82F6" />

    {/* Brand Badge */}
    <rect x="100" y="200" width="140" height="50" fill="url(#steelMetal)" stroke="#0B1F33" stroke-width="2" rx="4" />
    <text x="170" y="230" font-family="sans-serif" font-weight="900" font-size="14" fill="#0B1F33" text-anchor="middle">R.K. GLOBAL</text>
  </g>

  {/* Machinery 2: Secondary Blue Bending Machine */}
  <g transform="translate(1150, 440)">
    <ellipse cx="140" cy="300" rx="150" ry="24" fill="#1E293B" opacity="0.4" />
    <rect x="20" y="60" width="240" height="220" rx="12" fill="url(#machineBlue)" stroke="#0B1F33" stroke-width="3" />
    <rect x="35" y="75" width="210" height="190" fill="#FFFFFF" rx="8" />
    <rect x="10" y="30" width="260" height="35" fill="url(#steelMetal)" stroke="#0B1F33" stroke-width="3" />
    <circle cx="140" cy="47" r="45" fill="url(#steelMetal)" stroke="#0B1F33" stroke-width="2" />
    <circle cx="140" cy="47" r="18" fill="#0B1F33" />
    <circle cx="80" cy="110" r="10" fill="#EF4444" />
    <circle cx="105" cy="110" r="8" fill="#10B981" />
  </g>
</svg>
