<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradCut" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <linearGradient id="groundGradCut" x1="0" y1="580" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="machineBlueCut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>

  <rect width="1600" height="580" fill="url(#skyGradCut)" />

  {/* Sky & Clouds */}
  <ellipse cx="400" cy="160" rx="140" ry="40" fill="#FFFFFF" opacity="0.6" />
  <ellipse cx="1100" cy="140" rx="180" ry="50" fill="#FFFFFF" opacity="0.7" />

  {/* City Backdrop */}
  <rect x="700" y="160" width="150" height="420" fill="#475569" opacity="0.4" />
  <rect x="880" y="100" width="180" height="480" fill="#334155" opacity="0.5" />
  <rect x="1080" y="200" width="130" height="380" fill="#475569" opacity="0.4" />
  <rect x="1240" y="140" width="200" height="440" fill="#1E293B" opacity="0.55" />

  {/* Ground */}
  <rect y="580" width="1600" height="320" fill="url(#groundGradCut)" />

  {/* Machine 1: Blue GQ40-H Rebar Cutter */}
  <g transform="translate(520, 360)">
    <ellipse cx="240" cy="380" rx="260" ry="32" fill="#0F172A" opacity="0.5" />

    {/* Wheels */}
    <circle cx="80" cy="360" r="32" fill="#1E293B" stroke="#64748B" stroke-width="6" />
    <circle cx="380" cy="360" r="32" fill="#1E293B" stroke="#64748B" stroke-width="6" />

    {/* Body Frame */}
    <path d="M 40 160 L 160 80 L 440 80 L 460 340 L 20 340 Z" fill="url(#machineBlueCut)" stroke="#0B1F33" stroke-width="4" />
    <rect x="360" y="120" width="90" height="180" fill="#0284C7" stroke="#0B1F33" stroke-width="3" rx="8" />

    {/* Red Handle */}
    <rect x="60" y="120" width="18" height="80" rx="9" fill="#EF4444" stroke="#7F1D1D" stroke-width="2" />
    <rect x="50" y="100" width="40" height="20" rx="4" fill="#EF4444" />

    {/* Cutting Head & Flywheel */}
    <circle cx="480" cy="220" r="55" fill="#0284C7" stroke="#0B1F33" stroke-width="4" />
    <circle cx="480" cy="220" r="35" fill="#E2E8F0" stroke="#0B1F33" stroke-width="3" />

    {/* Model Badge GQ40-H */}
    <rect x="180" y="120" width="120" height="36" fill="#DC2626" rx="4" />
    <text x="240" y="144" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">GQ40-H</text>
  </g>

  {/* Machine 2: Heavy GQ-50 Rebar Cutter */}
  <g transform="translate(1080, 320)">
    <ellipse cx="220" cy="420" rx="240" ry="30" fill="#0F172A" opacity="0.5" />
    <circle cx="60" cy="400" r="32" fill="#1E293B" stroke="#64748B" stroke-width="6" />
    <circle cx="360" cy="400" r="32" fill="#1E293B" stroke="#64748B" stroke-width="6" />

    <path d="M 30 140 L 140 70 L 400 70 L 420 380 L 10 380 Z" fill="url(#machineBlueCut)" stroke="#0B1F33" stroke-width="4" />
    <rect x="160" y="110" width="110" height="36" fill="#DC2626" rx="4" />
    <text x="215" y="134" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">GQ-50</text>
    <circle cx="440" cy="240" r="50" fill="#0284C7" stroke="#0B1F33" stroke-width="4" />
  </g>
</svg>
